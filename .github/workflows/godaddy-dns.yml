name: Connect lead-generation domains

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/godaddy-dns.yml
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Update approved web DNS records
        env:
          GODADDY_PAT: ${{ secrets.GODADDY_PAT }}
        run: |
          node <<'NODE'
          const token = process.env.GODADDY_PAT;
          if (!token) throw new Error("Missing GODADDY_PAT repository secret");

          const sites = [
            {
              zone: "twincityfences.com",
              a: ["162.159.143.30", "172.66.3.26"],
              cname: "custom-domains.chatgpt.site.",
              txt: {
                "_openai-site-verification": "openai-site-verification=_tZw9JOZXI07poi7DdFpJgKoNSbofBMO_hp1gbHPdFM",
                "_cf-custom-hostname": "505dd9e3-9eea-4de4-b2ba-a1b68c147a63",
                "_openai-site-verification.www": "openai-site-verification=Ebt0DeSrtRhOq5BxS1My04rdf-DWGsOVJ4LUKjKnrRA",
                "_cf-custom-hostname.www": "c9200de1-e87d-4c9f-aeef-f7bda165721d"
              }
            },
            {
              zone: "birdsnestflowershop.com",
              a: ["162.159.143.30", "172.66.3.26"],
              cname: "custom-domains.chatgpt.site.",
              txt: {
                "_openai-site-verification": "openai-site-verification=uI1jn3Rj1hz9gPP8u1q2QQzinFkOvIjcWhrs2gOInKA",
                "_cf-custom-hostname": "3b84ed62-ed45-4b32-8725-298db9687d2d",
                "_openai-site-verification.www": "openai-site-verification=ez9RzGRLhxrcIHKdt1WONb2ZhRbezn_fpe_jwA_e_Cw",
                "_cf-custom-hostname.www": "0621c257-58e5-4703-9523-50c55e5ba0ec"
              }
            }
          ];

          const normalized = value => String(value).replace(/\.$/, "").toLowerCase();

          async function request(zone, path = "", options = {}) {
            const base = `https://api.godaddy.com/v3/domains/zones/${zone}/dns-records`;
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {})
              }
            });
            const body = response.status === 204 ? null : await response.json().catch(() => null);
            if (!response.ok) throw new Error(`${zone}: ${options.method || "GET"} failed (${response.status}) ${JSON.stringify(body)}`);
            return body;
          }

          async function list(zone) {
            return (await request(zone, "?pageSize=100&totalRequired=true")).items || [];
          }
          async function create(zone, record) {
            await request(zone, "", {method:"POST", body:JSON.stringify(record)});
          }
          async function replace(zone, id, record) {
            await request(zone, `/${encodeURIComponent(id)}`, {method:"PUT", body:JSON.stringify(record)});
          }
          async function remove(zone, id) {
            await request(zone, `/${encodeURIComponent(id)}`, {method:"DELETE"});
          }
          async function setGroup(zone, type, name, values) {
            const current = (await list(zone)).filter(r => r.type === type && r.name === name);
            const desired = values.map(data => ({type,name,data,ttl:600}));
            for (let i=0;i<desired.length;i++) {
              if (current[i]) await replace(zone,current[i].recordId,desired[i]);
              else await create(zone,desired[i]);
            }
            for (const extra of current.slice(desired.length)) await remove(zone,extra.recordId);
          }

          for (const site of sites) {
            const existing = await list(site.zone);
            for (const record of existing.filter(r =>
              (r.name === "@" && r.type === "AAAA") ||
              (r.name === "www" && ["A","AAAA"].includes(r.type))
            )) await remove(site.zone,record.recordId);

            await setGroup(site.zone,"A","@",site.a);
            await setGroup(site.zone,"CNAME","www",[site.cname]);
            for (const [name,data] of Object.entries(site.txt)) await setGroup(site.zone,"TXT",name,[data]);

            const final = await list(site.zone);
            const expected = [
              ...site.a.map(data=>["A","@",data]),
              ["CNAME","www",site.cname],
              ...Object.entries(site.txt).map(([name,data])=>["TXT",name,data])
            ];
            for (const [type,name,data] of expected) {
              if (!final.some(r=>r.type===type && r.name===name && normalized(r.data)===normalized(data))) {
                throw new Error(`${site.zone}: verification failed for ${type} ${name}`);
              }
            }
            console.log(`${site.zone}: DNS updated and verified`);
          }
          NODE
